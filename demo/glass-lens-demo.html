<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szklane oczko — spójny motyw 1-zone / 2-zone</title>
<style>
  :root{ color-scheme:dark; }
  body{
    margin:0; padding:22px 16px 40px;
    background:
      radial-gradient(120% 90% at 20% 0%, #15233b, #0a111e 60%),
      #070c16;
    color:#cbd5e1;
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  h1{ font-size:18px; color:#e2e8f0; margin:0 0 4px; }
  p.lead{ max-width:760px; margin:0 0 14px; color:#94a3b8; }
  .controls{ margin:10px 0 22px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .grid{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:26px 14px; max-width:880px;
  }
  .colhead{ grid-column:span 1; text-align:center; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:#7c8aa0; font-weight:700; }
  .cell{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .cap{ font-size:11px; color:#8696ad; letter-spacing:.04em; text-align:center; }

  /* ───────── PRODUCTION CHROME (kopia z buttonChrome.js) ───────── */
  .oge-host{
    --surface:#0b1220; --rim:#38bdf8; --glow:1; --label:#f8fafc;
    position:relative; border-radius:50%; isolation:isolate;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Verdana,sans-serif;
    font-weight:700; color:var(--label);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.07),
      inset 0 0 0 1.5px color-mix(in oklab,var(--rim) 55%,transparent),
      0 0 calc(24px * var(--glow)) -6px var(--rim),
      0 18px 36px -12px rgba(0,0,0,.72),
      0 4px 12px -2px rgba(0,0,0,.5);
  }
  .oge-host.single{
    background:radial-gradient(125% 125% at 50% 16%,
      color-mix(in oklab,var(--rim) 26%,var(--surface)) 0%, var(--surface) 62%);
  }
  .oge-host.split{
    overflow:hidden; display:flex; flex-direction:column; background:var(--surface);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.12),
      inset 0 0 0 1.5px color-mix(in oklab,var(--rim) 72%,transparent),
      inset 0 0 0 3px rgba(0,0,0,.45),
      0 0 calc(24px * var(--glow)) -6px var(--rim),
      0 18px 36px -12px rgba(0,0,0,.72),
      0 4px 12px -2px rgba(0,0,0,.5);
  }
  .oge-host .zone{
    flex:1; border:none; cursor:pointer; color:var(--label); font-weight:700;
    display:flex; align-items:center; justify-content:center; text-align:center;
    position:relative;
    background:radial-gradient(150% 150% at 50% 0%,
      color-mix(in oklab,var(--rim) 30%,var(--surface)),
      color-mix(in oklab,var(--rim) 12%,var(--surface)));
  }
  .oge-host .zone+.zone::before{
    content:""; position:absolute; left:14%; right:14%; top:-.5px; height:1.5px; z-index:4;
    background:linear-gradient(90deg,
      color-mix(in oklab,var(--rim) 60%,#fff), transparent,
      color-mix(in oklab,var(--rim) 60%,#fff));
    opacity:.55;
  }
  .oge-btn-label{
    display:flex; align-items:center; justify-content:center; width:100%;
    pointer-events:none; z-index:3; text-shadow:0 1px 2px rgba(0,0,6,.45);
    font-size:var(--fs);
  }
  .oge-host.single>.oge-btn-label{ position:absolute; inset:0; }
  .lbl{ display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .lbl .m{ font-size:1em; }
  .lbl .s{ font-size:.5em; opacity:.85; margin-top:2px; }
  .lbl .h{ font-size:.34em; opacity:.7; margin-top:2px; font-weight:600; }
  .zone.top .oge-btn-label{ transform:translateY(-14px); }
  .zone.bot .oge-btn-label{ transform:translateY(14px); }

  /* ───────── OBECNIE: płaski wodny znak (single) / płaska tarcza (split) ───────── */
  .now .oge-art{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    display:flex; align-items:flex-start; justify-content:center; padding-top:13%;
    color:var(--rim); opacity:.1;
  }
  .now .oge-art svg{ width:30%; height:30%; overflow:visible; }
  .now .oge-disc{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:33%; height:33%; border-radius:50%; z-index:5; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    color:color-mix(in oklab,var(--rim) 58%,var(--label));
    background:radial-gradient(120% 120% at 50% 30%,
      color-mix(in oklab,var(--rim) 12%,var(--surface)), var(--surface) 82%);
    box-shadow:
      inset 0 0 0 1px color-mix(in oklab,var(--rim) 34%,transparent),
      0 1px 3px rgba(0,0,0,.45);
  }
  .now .oge-disc svg{ width:62%; height:62%; opacity:.82; overflow:visible;
    filter:drop-shadow(0 1px 2px rgba(0,0,6,.5)); }

  /* ───────── SZKLANE OCZKO (wspólne) ───────── */
  .oge-lens{
    position:absolute; border-radius:50%; z-index:5; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    color:color-mix(in oklab,var(--rim) 62%,var(--label));
  }
  .oge-lens svg{ width:56%; height:56%; overflow:visible; }
  /* split: mały węzeł dokładnie na środku, na szwie */
  .lens-split{ left:50%; top:50%; width:21%; height:21%; transform:translate(-50%,-50%); }
  /* single: mały akcent w górnej sekcji */
  .lens-single{ left:50%; top:27%; width:23%; height:23%; transform:translate(-50%,-50%); }
  /* etykieta single delikatnie w dół, by nie kolidowała z małym oczkiem u góry */
  .glass .oge-host.single>.oge-btn-label{ align-items:center; padding-top:14%; }

  /* WARIANT A — subtelne szkło: lekka kopuła, delikatny połysk */
  .v-a .oge-lens{
    background:
      radial-gradient(130% 110% at 50% 16%, rgba(255,255,255,.14), transparent 44%),
      radial-gradient(120% 120% at 50% 34%,
        color-mix(in oklab,var(--rim) 16%,var(--surface)), var(--surface) 80%);
    box-shadow:
      inset 0 1.5px 2px rgba(255,255,255,.22),
      inset 0 -4px 7px rgba(0,0,6,.5),
      inset 0 -2px 5px color-mix(in oklab,var(--rim) 20%,transparent),
      inset 0 0 0 1px color-mix(in oklab,var(--rim) 38%,transparent),
      0 2px 4px rgba(0,0,0,.5);
  }
  .v-a .oge-lens::after{
    content:""; position:absolute; left:21%; top:13%; width:40%; height:28%;
    border-radius:50%; transform:rotate(-10deg); filter:blur(.4px);
    background:radial-gradient(closest-side, rgba(255,255,255,.40), transparent 78%);
  }
  .v-a .oge-lens svg{ opacity:.86; filter:drop-shadow(0 1px 1px rgba(0,0,6,.5)); }

  /* WARIANT B — wyraźne szkło: mocniejsza kopuła, ostry highlight, glow krawędzi */
  .v-b .oge-lens{
    background:
      radial-gradient(120% 100% at 50% 13%, rgba(255,255,255,.30), transparent 47%),
      radial-gradient(120% 125% at 50% 36%,
        color-mix(in oklab,var(--rim) 24%,var(--surface)),
        color-mix(in oklab,var(--surface) 88%,#000) 86%);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.36),
      inset 0 -6px 11px rgba(0,0,6,.62),
      inset 0 -3px 7px color-mix(in oklab,var(--rim) 34%,transparent),
      inset 0 0 0 1px color-mix(in oklab,var(--rim) 52%,transparent),
      inset 0 0 13px -2px color-mix(in oklab,var(--rim) 30%,transparent),
      0 3px 7px rgba(0,0,0,.55),
      0 0 10px -3px var(--rim);
  }
  .v-b .oge-lens::after{
    content:""; position:absolute; left:16%; top:9%; width:50%; height:36%;
    border-radius:50%; transform:rotate(-12deg);
    background:radial-gradient(closest-side,
      rgba(255,255,255,.62), rgba(255,255,255,.12) 58%, transparent 80%);
  }
  .v-b .oge-lens svg{ opacity:.96; filter:drop-shadow(0 1px 2px rgba(0,0,6,.6)); }
</style>
</head>
<body>
  <h1>Szklane oczko — spójny motyw dla 1-zone i 2-zone</h1>
  <p class="lead">Jedno wypukłe, „przeszklone" oczko z imitacją światła i grafiką w środku.
  1-zone: w górnej sekcji (napisy zjeżdżają niżej). 2-zone: na środku, na szwie.
  Kolumny: <b>Obecnie</b> (płaski wodny znak / płaska tarcza) · <b>Szkło A</b> (subtelne) ·
  <b>Szkło B</b> (wyraźne).</p>
  <div class="controls">
    <label>rozmiar <input type="range" id="size" min="120" max="360" step="4" value="280">
      <b id="sizeVal">280 px</b></label>
  </div>

  <div class="grid" id="grid"></div>

<script>
const GLYPH = {
  comet:'<g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(32,32) scale(1.15) translate(-32,-32)"><line x1="35" y1="29" x2="10" y2="54"/><line x1="40" y1="35" x2="24" y2="51"/><line x1="29" y1="24" x2="17" y2="36"/><circle cx="44" cy="20" r="9" fill="currentColor"/><path d="M55 40 v6 M52 43 h6"/><path d="M14 16 v5 M11.5 18.5 h5"/></g>',
  lander:'<g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 41 V27 a12 12 0 0 1 24 0 V41 Z"/><circle cx="32" cy="29" r="4.5" fill="currentColor"/><line x1="23" y1="41" x2="15" y2="53"/><line x1="41" y1="41" x2="49" y2="53"/><line x1="10" y1="53" x2="20" y2="53"/><line x1="44" y1="53" x2="54" y2="53"/></g>',
  planet:'<g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="45" r="11"/><path d="M12.5 41.5 Q18 39 23.5 41.5" stroke-width="2.5"/><path d="M29.5 36 Q39 34 44 21"/><path d="M45.5 28 L44 21 L38.1 25.2"/><circle cx="52" cy="11" r="6" fill="currentColor"/></g>',
  dna:'<g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(32,32) rotate(45) scale(1.15) translate(-32,-32)"><line x1="25" y1="14" x2="39" y2="14"/><line x1="29" y1="22" x2="35" y2="22"/><line x1="29" y1="42" x2="35" y2="42"/><line x1="25" y1="50" x2="39" y2="50"/><path d="M23 7 C23 20 41 24 41 32 C41 40 23 44 23 57"/><path d="M41 7 C41 20 23 24 23 32 C23 40 41 44 41 57"/></g>',
};
const svg = (k)=>`<svg viewBox="0 0 64 64">${GLYPH[k]}</svg>`;
const lbl = (m,s,h)=>`<span class="oge-btn-label"><span class="lbl"><span class="m">${m}</span>${s?`<span class="s">${s}</span>`:''}${h?`<span class="h">${h}</span>`:''}</span></span>`;

// single-zone example: Expeditions (comet, niebieski)
function single(variant){
  const isNow = variant==='now';
  const inner = isNow
    ? `<span class="oge-art">${svg('comet')}</span>` + lblSingle()
    : `<span class="oge-lens lens-single">${svg('comet')}</span>` + lblSingle();
  return host('single '+variant, '#38bdf8', inner);
}
function lblSingle(){ return lbl('Send','Expedition'); }

// 2-zone example: Daily Run (planeta, zielony) — glif w górnej strefie/centrum
function split(variant){
  const isNow = variant==='now';
  const top = `<button class="zone top">${lbl('Dispatch','6:74:8')}</button>`;
  const bot = `<button class="zone bot">${lbl('Collect','+5')}</button>`;
  const node = isNow
    ? `<span class="oge-disc">${svg('planet')}</span>`
    : `<span class="oge-lens lens-split">${svg('planet')}</span>`;
  return host('split '+variant, '#34d399', top+bot+node);
}
function host(cls, rim, inner){
  return `<div class="oge-host ${cls}" style="--rim:${rim};width:var(--d);height:var(--d);--fs:calc(var(--d)*0.12)">${inner}</div>`;
}

const grid = document.getElementById('grid');
const heads = ['Obecnie','Szkło A — subtelne','Szkło B — wyraźne'];
const variants = ['now','v-a','v-b'];
function render(){
  grid.innerHTML =
    heads.map(h=>`<div class="colhead">${h}</div>`).join('') +
    variants.map(v=>`<div class="cell ${v==='now'?'':'glass'}">${single(v)}<div class="cap">1-zone · Wyprawy</div></div>`).join('') +
    variants.map(v=>`<div class="cell ${v==='now'?'':'glass'}">${split(v)}<div class="cap">2-zone · Daily Run</div></div>`).join('');
}
render();

const size = document.getElementById('size'), sizeVal = document.getElementById('sizeVal');
function applySize(){ document.documentElement.style.setProperty('--d', size.value+'px'); sizeVal.textContent = size.value+' px'; }
size.addEventListener('input', applySize); applySize();
</script>
</body>
</html>
