name: Release to AMO

# The OFFICIAL release path: push a vX.Y.Z tag → this publishes that version to
# AMO (listed: publicly visible, auto-offered to existing users). So pushing a
# vX.Y.Z tag = a real public release.
#
# It runs the exact same scripts/release.mjs as a local `npm run release`. The
# script auto-detects CI (the tag already exists and HEAD is detached), so it
# SKIPS the commit/tag and the push and just validates → packages → uploads.
#
# How to cut a release:
#   1. Land code + tests on main, gates green.
#   2. Add the dated "## [X.Y.Z] — YYYY-MM-DD" section to CHANGELOG.md.
#   3. Run `npm run release 1.25.1`:
#        • with .env creds  → it uploads to AMO itself and pushes the tag
#          (this CI run then no-ops, since the version is already on AMO);
#        • without creds    → it bumps/commits/tags/pushes only, and THIS
#          workflow does the AMO upload.
#
# Requires AMO_JWT_ISSUER / AMO_JWT_SECRET in repo → Settings → Secrets.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read # the tag already exists on the remote — nothing to push

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release to AMO from the tag
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/release.mjs "${GITHUB_REF_NAME#v}"
