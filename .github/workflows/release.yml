name: Release to AMO + Chrome Web Store

# The ONE release path: bump the version in package.json (+ manifest.json), add
# a dated "## [X.Y.Z] — YYYY-MM-DD" section to CHANGELOG.md, and push that
# `chore(release): X.Y.Z` commit to main. This workflow does everything else —
# there is NO hand-pushed tag and no local AMO upload to remember. (We never cut
# tags ourselves; CI mints them.)
#
# On every push to main it inspects the commit and, when BOTH hold:
#   1. package.json's "version" has a dated "## [X.Y.Z] — YYYY-MM-DD" section in
#      CHANGELOG.md  — i.e. this is a real, documented release, and
#   2. the tag vX.Y.Z does not already exist on the remote,
# it mints + pushes the tag, checks it out (detached HEAD) and runs
# scripts/release.mjs to validate → test → package → upload to AMO. In practice
# only a `chore(release): X.Y.Z` commit bumps the version AND adds the CHANGELOG
# section, so ordinary pushes to main publish nothing — the guard is a no-op.
#
# Why mint the tag here instead of pushing it by hand: some environments 403 tag
# pushes, and a tag pushed with the default GITHUB_TOKEN wouldn't re-trigger a
# separate workflow anyway (GitHub's loop guard) — so the tag and the publish
# must live in the SAME run. scripts/release.mjs auto-detects this CI situation
# (tag present + detached HEAD) and skips its own commit/tag/push, doing just
# the upload — git is never touched.
#
# Requires AMO_JWT_ISSUER / AMO_JWT_SECRET in repo → Settings → Secrets, and
# Settings → Actions → Workflow permissions = "Read and write" (to push the tag).
#
# Chrome Web Store upload is OPTIONAL and independent: add CWS_CLIENT_ID /
# CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN / CWS_EXTENSION_ID as secrets and the
# same run also uploads + submits to the Chrome Web Store. Absent secrets → the
# CWS step is a clean no-op (AMO still publishes). scripts/release.mjs owns both
# uploads; this workflow just injects the creds.

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # mint + push the vX.Y.Z tag

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + all tags for the guard

      - name: Decide whether this commit is a new, documented release
        id: guard
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="v$VERSION"

          # 1. dated CHANGELOG section for exactly this version? The separator
          #    accepts em-dash / en-dash / hyphen so a dash-typo can't silently
          #    skip the release (mirrors scripts/release.mjs extractChangelogSection).
          ESC=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          if ! grep -qE "^## \[$ESC\] [—–-] [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "release: no dated CHANGELOG section for $VERSION — skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. tag must not already exist on the remote
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "release: $TAG already on the remote — skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release: $TAG is new and documented — will tag + publish."
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Create and push the tag
        if: steps.guard.outputs.release == 'true'
        run: |
          TAG="v${{ steps.guard.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Check out the tag (detached HEAD, mirrors the script's CI path)
        if: steps.guard.outputs.release == 'true'
        run: git checkout "v${{ steps.guard.outputs.version }}"

      - name: Set up Node.js
        if: steps.guard.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.release == 'true'
        run: npm ci

      - name: Release to AMO + Chrome Web Store from the freshly-minted tag
        if: steps.guard.outputs.release == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node scripts/release.mjs "${{ steps.guard.outputs.version }}"
