name: Release to AMO (unlisted)

# Experimental release workflow — uploads a signed but unlisted version to AMO.
# Unlisted = Mozilla signs it, you get a direct URL, existing users are NOT
# offered the update. Designed for owner-only smoke-testing a build BEFORE the
# public (listed) release.
#
# Manual on purpose (workflow_dispatch): you pick the version to test.
#
# Note on versioning: AMO version numbers are globally unique per add-on, so a
# number uploaded here as "unlisted" can never later be released as "listed".
# Use a throwaway/pre-release number for smoke tests, not the number you intend
# to ship. This job runs with --no-push precisely so it does NOT create a
# vX.Y.Z tag on the remote (which would otherwise trigger the listed workflow).
#
# How to use:
#   1. Add AMO_JWT_ISSUER and AMO_JWT_SECRET to repo → Settings → Secrets
#   2. Go to Actions → "Release to AMO (unlisted)" → Run workflow
#   3. After the job finishes, the signed .xpi can be installed via the direct
#      AMO URL (your add-on → Edit → Versions → find the unlisted version).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match [X.Y.Z] entry in CHANGELOG.md)'
        required: true
        default: '1.17.0'
      skip_tests:
        description: 'Skip test + typecheck phase (use when already verified green)'
        required: false
        default: 'false'
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # --no-push: a smoke test must not leave a vX.Y.Z tag on the remote
        # (that would fire the listed workflow). The local tag release.mjs
        # creates is discarded with the runner.
        run: |
          SKIP=""
          if [ "${{ inputs.skip_tests }}" = "true" ]; then
            SKIP="--skip-tests"
          fi
          node scripts/release.mjs ${{ inputs.version }} --unlisted --no-push $SKIP
