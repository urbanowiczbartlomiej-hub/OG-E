name: Release to AMO (unlisted)

# Experimental release workflow — uploads a signed but unlisted version to AMO.
# Unlisted = Mozilla signs it, you get a direct URL, existing users are NOT
# offered the update. Designed for owner-only testing before a public release.
#
# How to use:
#   1. Add AMO_JWT_ISSUER and AMO_JWT_SECRET to repo → Settings → Secrets
#   2. Go to Actions → "Release to AMO (unlisted)" → Run workflow
#   3. After the job finishes, the signed .xpi can be installed via the direct
#      AMO URL (your add-on → Edit → Versions → find the unlisted version).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match [X.Y.Z] entry in CHANGELOG.md)'
        required: true
        default: '1.17.0'
      skip_tests:
        description: 'Skip test + typecheck phase (use when already verified green)'
        required: false
        default: 'false'
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the release commit + tag

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Release (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          SKIP=""
          if [ "${{ inputs.skip_tests }}" = "true" ]; then
            SKIP="--skip-tests"
          fi
          node scripts/release.mjs ${{ inputs.version }} --unlisted $SKIP
