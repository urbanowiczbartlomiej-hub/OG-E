name: Release to AMO (listed)

# The one and only release workflow — fires automatically when a vX.Y.Z tag is
# pushed. The release is always LISTED: publicly visible on addons.mozilla.org,
# offered to existing users automatically. So pushing a vX.Y.Z tag = a real
# public release.
#
# How a release happens (tag-triggered):
#   1. Land code + tests on main, gates green.
#   2. Add the dated "## [X.Y.Z] — YYYY-MM-DD" section to CHANGELOG.md and
#      commit it (release.mjs reads it as the public AMO release notes).
#   3. Cut + push the tag:  node scripts/release.mjs X.Y.Z --no-upload
#      (no AMO tokens needed locally — bumps versions, commits, tags, pushes).
#   4. This workflow checks out the tag and runs the AMO upload.
#
# Requires AMO_JWT_ISSUER / AMO_JWT_SECRET in repo → Settings → Secrets.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # the tag already exists on the remote — nothing to push

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Release (listed) from tag
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # --no-push: the tag that triggered us is already on the remote and
        # HEAD is detached. release.mjs is idempotent — it skips the commit/tag
        # (tag exists) and the upload (if the version is already on AMO), so a
        # tag pushed by a local `npm run release` simply finishes as a no-op.
        run: node scripts/release.mjs "${{ steps.ver.outputs.version }}" --no-push
