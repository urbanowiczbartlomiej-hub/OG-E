name: Release to AMO (listed)

# Public release workflow — uploads a signed, listed version to AMO.
# Listed = publicly visible on addons.mozilla.org; existing users ARE
# offered the update automatically. Use for actual public releases.
#
# How to use:
#   1. Ensure AMO_JWT_ISSUER and AMO_JWT_SECRET are in repo → Settings → Secrets
#   2. Go to Actions → "Release to AMO (listed)" → Run workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match [X.Y.Z] entry in CHANGELOG.md)'
        required: true
        default: '1.18.0'
      skip_tests:
        description: 'Skip test + typecheck phase (use when already verified green)'
        required: false
        default: 'false'
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the release commit + tag

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity and auth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Install dependencies
        run: npm ci

      - name: Release (listed)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          SKIP=""
          if [ "${{ inputs.skip_tests }}" = "true" ]; then
            SKIP="--skip-tests"
          fi
          node scripts/release.mjs ${{ inputs.version }} $SKIP
